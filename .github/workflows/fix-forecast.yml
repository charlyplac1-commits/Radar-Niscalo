name: Fix forecast once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[forecast-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert robust forecast renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='async function cargarDatos(){'
          if 'function mostrarPrevision(diario){' not in s:
              fn=r'''function mostrarPrevision(diario){
                const caja=document.getElementById("prevision");
                if(!caja) return;
                if(!diario || !Array.isArray(diario.time)){
                  caja.innerHTML='<div class="muted">Previsión no disponible ahora.</div>';
                  return;
                }
                const w=diario.weather_code||[];
                const tmax=diario.temperature_2m_max||[];
                const tmin=diario.temperature_2m_min||[];
                const rain=diario.precipitation_sum||[];
                const prob=diario.precipitation_probability_max||[];
                const wind=diario.wind_gusts_10m_max||[];
                const icon=(code)=>{
                  const c=Number(code);
                  if(c===0) return '☀️';
                  if(c<=3) return '⛅';
                  if(c<=48) return '🌫️';
                  if(c<=67) return '🌧️';
                  if(c<=77) return '🌨️';
                  if(c<=82) return '🌦️';
                  return '⛈️';
                };
                const nombre=(iso)=>{
                  const d=new Date(iso+'T12:00:00');
                  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
                };
                caja.innerHTML=diario.time.slice(0,7).map((fecha,i)=>`<div class="day"><b>${nombre(fecha)}</b><div class="ico">${icon(w[i])}</div><strong>${Number.isFinite(Number(tmax[i]))?Math.round(tmax[i])+'°':'--'} / ${Number.isFinite(Number(tmin[i]))?Math.round(tmin[i])+'°':'--'}</strong><div>🌧️ ${Number(rain[i]||0).toFixed(1)} mm</div><div>💧 ${Math.round(Number(prob[i]||0))}%</div><div>💨 ${Math.round(Number(wind[i]||0))} km/h</div></div>`).join('');
              }
          '''
              if marker not in s:
                  raise SystemExit('No se encontró cargarDatos')
              s=s.replace(marker,fn+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-forecast.yml
          git commit -m '[forecast-fix] Restaurar Previsión en vivo'
          git push