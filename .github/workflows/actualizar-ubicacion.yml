name: Actualizar datos por ubicación

on:
  push:
    paths:
      - '.github/workflows/actualizar-ubicacion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir carga meteorológica por coordenadas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''    "&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max,weather_code,et0_fao_evapotranspiration";'''
          new='''    "&daily=temperature_2m_max,temperature_2m_min,temperature_2m_mean,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max,weather_code,et0_fao_evapotranspiration"+\n    "&cacheBust="+Date.now();'''
          if old not in s:
              raise SystemExit('No se encontró la URL meteorológica esperada')
          s=s.replace(old,new,1)
          old2='''    try{ moverMapa(lat,lon); }catch(e){console.warn("Mapa:",e);}\n    try{ pintarMapaZonas(lat,lon); }catch(e){console.warn("Zonas:",e);}'
          new2='''    try{ moverMapa(lat,lon); }catch(e){console.warn("Mapa:",e);}\n    try{\n      const windy=$("windy");\n      if(windy){\n        windy.src="https://embed.windy.com/embed2.html?lat="+encodeURIComponent(lat)+"&lon="+encodeURIComponent(lon)+"&detailLat="+encodeURIComponent(lat)+"&detailLon="+encodeURIComponent(lon)+"&width=650&height=450&zoom=7&level=surface&overlay=rain&product=ecmwf&menu=&message=true&marker=true&calendar=now&pressure=true&type=map&location=coordinates&detail=true&metricWind=default&metricTemp=default&metricRain=default&metricSnow=default&metricCloud=default";\n      }\n    }catch(e){console.warn("Windy:",e);}\n    try{ pintarMapaZonas(lat,lon); }catch(e){console.warn("Zonas:",e);}'
          if old2 not in s:
              raise SystemExit('No se encontró el punto de actualización del mapa')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir datos meteorológicos y radar por ubicación" || exit 0
          git push
      - name: Retirar este parche de una sola vez
        run: |
          rm -f .github/workflows/actualizar-ubicacion.yml
          git add .github/workflows/actualizar-ubicacion.yml
          git commit -m "Retirar parche temporal de ubicación" || exit 0
          git push