# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\\b[^>]*>([\\s\\S]*?)</script>', html, flags=re.I)
          js = [s for s in scripts if s.strip()]
          if not js:
            raise SystemExit('No inline JavaScript found')
          for i, code in enumerate(js):
            pathlib.Path(f'/tmp/radar_script_{i}.js').write_text(code, encoding='utf-8')
          PY
          for f in /tmp/radar_script_*.js; do node --check "$f"; done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
