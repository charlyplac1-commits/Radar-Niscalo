name: Entrenar IA del Radar Níscalo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai/**"
      - ".github/workflows/niscalo-ai.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxscript pillow

      - name: Recopilar dataset con licencias compatibles
        run: python ai/collect_dataset.py

      - name: Entrenar detector visual
        run: python ai/train_model.py

      - name: Publicar modelo y manifiesto
        run: |
          mkdir -p models/niscalo-detector
          cp ai_dataset/manifest.csv models/niscalo-detector/dataset_manifest.csv
          cp ai_dataset/stats.json models/niscalo-detector/dataset_stats.json
          cp ai/README.md models/niscalo-detector/README.md
          git config user.name "radar-niscalo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/niscalo-detector
          if git diff --cached --quiet; then echo "Sin cambios que publicar"; exit 0; fi
          git commit -m "Entrenar y actualizar detector visual de níscalos"
          git push
