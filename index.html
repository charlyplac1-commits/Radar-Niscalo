*{

box-sizing:border-box;

}

body{

margin:0;

background:#f5f2e9;

color:#17231b;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

header{

background:#214b35;

color:white;

padding:20px 16px;

position:sticky;

top:0;

z-index:1000;

}

header b{

font-size:24px;

}

header small{

display:block;

margin-top:5px;

opacity:.85;

}

main{max-width:1000px;margin:auto;padding:8px}
details.compact{background:white;border:1px solid #dfe3dc;border-radius:14px;padding:0 12px;margin:8px 0;box-shadow:0 1px 5px rgba(0,0,0,.04)}
details.compact>summary{cursor:pointer;font-weight:800;padding:12px 2px;list-style:none}
details.compact>summary::-webkit-details-marker{display:none}
details.compact>summary:after{content:"＋";float:right;font-size:18px;color:#68736b}
details.compact[open]>summary:after{content:"−"}
details.compact .inside{padding:0 0 10px}
.metric-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}
.metric{background:#f5f7f3;border-radius:12px;padding:9px;text-align:center}
.metric .big{font-size:20px}
@media(max-width:720px){.metric-strip{grid-template-columns:repeat(2,1fr)}}

.card{

background:white;

border:1px solid #dfe3dc;

border-radius:16px;

padding:16px;

margin:12px 0;

box-shadow:0 2px 8px rgba(0,0,0,.05);

}

.tabs{

display:flex;

gap:8px;

overflow-x:auto;

margin-bottom:10px;

}

button{

background:#214b35;

color:white;

border:0;

border-radius:10px;

padding:11px 14px;

margin-top:10px;

font-weight:700;

cursor:pointer;

}

.tabs button{

margin:0;

background:#e5e9e3;

color:#17231b;

white-space:nowrap;

}

.tabs .on{

background:#214b35;

color:white;

}

button.secondary{

background:#e5e9e3;

color:#17231b;

}

button.danger{

background:#9b3d35;

}

.score{

display:flex;

gap:16px;

align-items:center;

}

.ring{

width:92px;

height:92px;

border-radius:50%;

display:grid;

place-items:center;

flex:none;

background:conic-gradient(#3e8b58 0 0%,#e5e9e3 0% 100%);

}

.ring b{

background:white;

border-radius:50%;

width:70px;

height:70px;

display:grid;

place-items:center;

font-size:24px;

}

.grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:10px;

}

.k{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

}

.big{

font-size:26px;

font-weight:800;

}

.muted{

color:#68736b;

font-size:12px;

}

label{

display:block;

font-weight:700;

font-size:13px;

margin-top:12px;

}

input,select{

width:100%;

padding:10px;

border:1px solid #cfd6cf;

border-radius:9px;

background:white;

}

input[type=range]{

padding:0;

}

.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

}

.mapbox{

height:390px;

border-radius:15px;

overflow:hidden;

border:1px solid #dfe3dc;

}

#map{

height:100%;

}

.forecast{

display:flex;

gap:7px;

overflow-x:auto;

}

.day{

min-width:105px;

background:#f5f7f3;

border-radius:12px;

padding:9px;

text-align:center;

}

.day b{

display:block;

}

.day .ico{

font-size:25px;

margin:4px;

}

table{

width:100%;

border-collapse:collapse;

font-size:13px;

}

th,td{

padding:8px;

border-bottom:1px solid #e2e6e1;

text-align:left;

}

.badge{

display:inline-block;

padding:5px 8px;

border-radius:20px;

background:#edf3ed;

font-size:12px;

margin:2px;

}

.notice{

background:#fff8df;

border:1px solid #ead58b;

padding:10px;

border-radius:10px;

font-size:13px;

}

.list div{

padding:9px 0;

border-top:1px solid #e1e5df;

}

footer{

text-align:center;

padding:25px;

color:#68736b;

font-size:12px;

}

@media(max-width:720px){

.grid{

grid-template-columns:1fr 1fr;

}

.row{

grid-template-columns:1fr;

}

.mapbox{

height:330px;

}

}

/* ===== SPLASH BOSQUE ANIMADO ===== */
#appSplash{background:#07150e}
.splash-scene{position:relative;width:100%;height:100%;overflow:hidden;background:#07150e}
.splash-forest{position:absolute;inset:0;width:100%;height:100%;display:block}
.splash-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 43%,transparent 22%,rgba(3,12,7,.08) 48%,rgba(2,9,5,.72) 100%)}
.splash-copy{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.8);padding:0 20px}
.splash-brand{font-size:12px;font-weight:900;letter-spacing:2.4px;opacity:.92}
.splash-title{font-size:25px;font-weight:900;margin-top:9px;letter-spacing:-.4px}
.splash-sub{font-size:11px;opacity:.75;margin-top:6px;letter-spacing:1px}
.splash-copy .splash-scan{margin:20px auto 0;width:170px;height:3px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden}
.splash-copy .splash-scan i{display:block;width:40%;height:100%;background:#e9a34b;box-shadow:0 0 14px #e9a34b;animation:splashScan 1.1s ease-in-out infinite}
.splash-spores circle{animation:sporeFloat 5s ease-in-out infinite}
.splash-spores circle:nth-child(2n){animation-delay:-1.4s}.splash-spores circle:nth-child(3n){animation-delay:-3s}
.splash-radar{transform-origin:450px 650px;animation:radarSweep 4s linear infinite}
@keyframes radarSweep{to{transform:translate(450px,650px) rotate(360deg) translate(-450px,-650px)}}
@keyframes sporeFloat{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(18px,-32px);opacity:.8}}
@media(max-width:720px){.splash-copy{bottom:10%}.splash-title{font-size:23px}.splash-brand{font-size:11px}.splash-sub{font-size:10px}}

/* ===== EXPERIENCIA APP · BOSQUE / INSTRUMENTO DE CAMPO ===== */
#appSplash{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#315f43 0,#183b29 42%,#0d2418 100%);color:#fff;transition:opacity .55s ease,visibility .55s ease}
#appSplash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center;transform:translateY(-8px);animation:splashIn .7s ease both}
.splash-mush{font-size:72px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.28));animation:splashPulse 1.8s ease-in-out infinite}
.splash-title{font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:8px}
.splash-sub{font-size:12px;opacity:.78;margin-top:5px;letter-spacing:.3px}
.splash-scan{width:150px;height:3px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;margin:22px auto 0}
.splash-scan i{display:block;width:42%;height:100%;background:#e9a34b;box-shadow:0 0 12px #e9a34b;animation:splashScan 1.05s ease-in-out infinite}
@keyframes splashIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes splashPulse{50%{transform:translateY(-3px) scale(1.035)}}
@keyframes splashScan{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
header.app-header{position:relative;overflow:hidden}
header.app-header:after{content:"";position:absolute;inset:-60% -20%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.10) 50%,transparent 58%);transform:translateX(-70%);animation:headerShimmer 8s ease-in-out infinite;pointer-events:none}
header.app-header .brand,header.app-header .header-status{position:relative;z-index:2}
@keyframes headerShimmer{0%,55%{transform:translateX(-70%)}75%,100%{transform:translateX(70%)}}
.header-status{position:relative;z-index:1}
.header-status span{animation:statusPulse 2s ease-in-out infinite}
@keyframes statusPulse{50%{box-shadow:0 0 0 5px rgba(143,209,158,.08)}}
#radar>.card.score{overflow:hidden}
#radar>.card.score:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-90px;top:-85px;background:radial-gradient(circle,rgba(47,107,70,.16),transparent 68%);pointer-events:none}

#motorDecisionCard{position:relative;overflow:hidden}

#decisionRadar{transition:transform .25s ease,box-shadow .25s ease}
#decisionRadar.flash{transform:scale(1.012);box-shadow:0 0 0 3px rgba(47,107,70,.08)}
.instrument-label{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:#637066;margin-bottom:5px}
.instrument-label i{width:6px;height:6px;border-radius:50%;background:#e56f32;box-shadow:0 0 8px rgba(229,111,50,.65)}

  position:relative;

  background:transparent;

.app-nav button span{
  font-weight:850;
}
.app-nav button:before{
  content:"";
  position:absolute;
  left:20%;
  right:20%;

  height:3px;
  border-radius:4px;
  background:#e56f32;

/* ===== PREVISIÓN PREMIUM · TARJETAS EN RELIEVE ===== */
.forecast{
  gap:9px !important;
  padding:3px 2px 10px !important;
  scrollbar-width:thin;
}
.forecast .day{
  position:relative;
  overflow:hidden;
  min-width:112px !important;
  padding:10px 9px 11px !important;
  border-radius:16px !important;
  color:#eef5ef !important;
  background:
    radial-gradient(circle at 85% 8%,rgba(103,159,111,.24),transparent 38%),
    linear-gradient(145deg,#294333 0%,#1b2c22 58%,#132018 100%) !important;
  border:1px solid rgba(145,190,151,.24) !important;
  box-shadow:
    0 9px 18px rgba(0,0,0,.30),
    0 2px 4px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -1px 0 rgba(0,0,0,.22) !important;
  transform:translateY(0);
  transition:transform .18s ease,box-shadow .18s ease;
}
.forecast .day:before{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  top:0;
  height:3px;
  border-radius:0 0 8px 8px;
  background:linear-gradient(90deg,#e7a34b,#77b878,#e7a34b);
  opacity:.9;
}
.forecast .day:after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  right:-28px;
  top:-30px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  filter:blur(2px);
}
.forecast .day:hover{
  transform:translateY(-3px);
  box-shadow:
    0 14px 24px rgba(0,0,0,.34),
    0 4px 8px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.14);
}
.forecast .day b{
  position:relative;
  z-index:1;
  color:#fff !important;
  font-size:12px;
  text-transform:capitalize;
}
.forecast .day .ico{
  position:relative;
  z-index:1;
  font-size:29px !important;
  margin:6px 0 !important;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.30));
}
.forecast .day strong{
  position:relative;
  z-index:1;
  display:block;
  color:#f7d89e !important;
  font-size:12px;
  margin-bottom:5px;
}
.forecast .day div:not(.ico){
  position:relative;
  z-index:1;
  color:#c9d7cc !important;
  font-size:11px;
  margin-top:3px;
}
